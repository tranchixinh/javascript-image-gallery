<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Image Gallery</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body onload="addTabFocus()">

    <header>
        <h1>Interactive Image Gallery</h1>
        <p>
            Use your mouse or keyboard to explore the images.
        </p>
    </header>

    <main>

        <div id="image">
            Hover over an image below to display it here.
        </div>

        <section class="gallery">

            <figure
                onmouseover="upDate(this.querySelector('img'))"
                onmouseleave="unDo()"
                onfocus="focusFunction(this)"
                onblur="blurFunction()">

                <img
                    src="https://picsum.photos/id/1015/600/400"
                    alt="Mountain landscape with a river">

                <figcaption>Mountain Landscape</figcaption>
            </figure>


            <figure
                onmouseover="upDate(this.querySelector('img'))"
                onmouseleave="unDo()"
                onfocus="focusFunction(this)"
                onblur="blurFunction()">

                <img
                    src="https://picsum.photos/id/1016/600/400"
                    alt="Mountain peaks beside a calm lake">

                <figcaption>Mountain and Lake</figcaption>
            </figure>


            <figure
                onmouseover="upDate(this.querySelector('img'))"
                onmouseleave="unDo()"
                onfocus="focusFunction(this)"
                onblur="blurFunction()">

                <img
                    src="https://picsum.photos/id/1025/600/400"
                    alt="A dog looking toward the camera">

                <figcaption>Dog</figcaption>
            </figure>


            <figure
                onmouseover="upDate(this.querySelector('img'))"
                onmouseleave="unDo()"
                onfocus="focusFunction(this)"
                onblur="blurFunction()">

                <img
                    src="https://picsum.photos/id/1035/600/400"
                    alt="Green forest with tall trees">

                <figcaption>Forest</figcaption>
            </figure>


            <figure
                onmouseover="upDate(this.querySelector('img'))"
                onmouseleave="unDo()"
                onfocus="focusFunction(this)"
                onblur="blurFunction()">

                <img
                    src="https://picsum.photos/id/1043/600/400"
                    alt="Ocean waves near a rocky coastline">

                <figcaption>Ocean</figcaption>
            </figure>


            <figure
                onmouseover="upDate(this.querySelector('img'))"
                onmouseleave="unDo()"
                onfocus="focusFunction(this)"
                onblur="blurFunction()">

                <img
                    src="https://picsum.photos/id/1069/600/400"
                    alt="Rocky mountain landscape under a blue sky">

                <figcaption>Rocky Mountains</figcaption>
            </figure>

        </section>

    </main>

</body>
</html>
