<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>JavaScript Image Gallery</h1>

    <div id="image">
        Di chuột qua một hình ảnh bên dưới để hiển thị ở đây.
    </div>

    <div class="gallery">
        <img src="https://picsum.photos/id/1015/300/200"
             alt="Mountain"
             onmouseover="upDate(this)"
             onmouseout="unDo()">

        <img src="https://picsum.photos/id/1016/300/200"
             alt="Forest"
             onmouseover="upDate(this)"
             onmouseout="unDo()">

        <img src="https://picsum.photos/id/1018/300/200"
             alt="River"
             onmouseover="upDate(this)"
             onmouseout="unDo()">

        <img src="https://picsum.photos/id/1025/300/200"
             alt="Dog"
             onmouseover="upDate(this)"
             onmouseout="unDo()">

        <img src="https://picsum.photos/id/1035/300/200"
             alt="Beach"
             onmouseover="upDate(this)"
             onmouseout="unDo()">

        <img src="https://picsum.photos/id/1043/300/200"
             alt="Lake"
             onmouseover="upDate(this)"
             onmouseout="unDo()">
    </div>

    <script src="script.js"></script>

</body>
</html>
